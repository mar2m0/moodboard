   it captures what fits on screen at screen resolution.
   ========================================================================== */

const nextFrame = () => new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));

/**
 * Captures at a zoom that yields TARGET_PX output pixels per board unit, which
 * usually means the board no longer fits on screen — so the stream stays open
 * while the view is scrolled across the board and each frame is stitched into
 * one image. Fitting the whole board on screen first would cap the result at
 * whatever the shrunken rendering held, which is what made it look soft.
 */
/** Scroll offsets covering `span`, always including the far edge. */
function passOffsets(span, step) {
  if (span <= 0) return [0];
  const out = [];
  for (let at = 0; at < span; at += step) out.push(Math.round(at));
  out.push(Math.round(span));
  return [...new Set(out)];
}

const TARGET_PX = 2;        // match the redraw export's resolution
const MAX_TILES = 48;
const MAX_SIDE = 12000;     // keep the output canvas within sane memory

async function captureBoardImage() {
  if (items.length === 0) { notify("보드가 비어 있습니다"); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
    notify("이 브라우저는 화면 캡처를 지원하지 않습니다");
    return;
  }

  setSelection([]);
  stopEditing();

  const view = $("scroll");
  const box = contentBounds(28);
  const devicePx = window.devicePixelRatio || 1;

  // Zoom so that one board unit lands on TARGET_PX device pixels, then back off
  // if that would need too many passes or too large an image.
  const stepX = view.clientWidth * 0.92;
  const stepY = view.clientHeight * 0.92;
  let target = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, TARGET_PX / devicePx));
  let xs, ys;
  for (;;) {
    xs = passOffsets(box.width * target - view.clientWidth, stepX);
    ys = passOffsets(box.height * target - view.clientHeight, stepY);
    const side = Math.max(box.width, box.height) * target * devicePx;
    if ((xs.length * ys.length <= MAX_TILES && side <= MAX_SIDE) || target <= ZOOM_MIN + 0.01) break;
    target = Math.max(ZOOM_MIN, target * 0.8);
  }
  const shots = xs.length * ys.length;

  if (shots > 1) {
    const ok = confirm(
      "선명하게 담으려고 보드를 " + Math.round(target * 100) + "% 로 키워 " + shots +
      "번에 나눠 찍습니다.\n\n" +
      "찍는 동안 화면이 움직입니다 — 건드리지 말고 기다려 주세요.\n\n" +
      "계속할까요?");
    if (!ok) { notify("캡처를 취소했습니다"); return; }
  }

  const beforeZoom = zoom;
  const beforeLeft = view.scrollLeft;
  const beforeTop = view.scrollTop;

  zoom = target;
  applyZoom();
  document.body.classList.add("capturing");
  await nextFrame();

  let stream;
  try {
    stream = await navigator.mediaDevices.getDisplayMedia({
      video: { displaySurface: "browser" },
      audio: false,
      preferCurrentTab: true,
      selfBrowserSurface: "include",
    });
  } catch (err) {
    document.body.classList.remove("capturing");
    zoom = beforeZoom;
    applyZoom();
    view.scrollTo(beforeLeft, beforeTop);
    notify(err && err.name === "NotAllowedError" ? "캡처를 취소했습니다" : "캡처를 시작하지 못했습니다");
    return;
  }

  try {
    const video = document.createElement("video");
    video.srcObject = stream;
    video.muted = true;
    await video.play();
    for (let tries = 0; tries < 60 && video.videoWidth === 0; tries++) await nextFrame();
    await nextFrame();

    const perCssPx = video.videoWidth / window.innerWidth;
    const perCssPxY = video.videoHeight / window.innerHeight;
    const outScale = zoom * perCssPx;

    const canvas = document.createElement("canvas");
    canvas.width = Math.round(box.width * outScale);
    canvas.height = Math.round(box.height * zoom * perCssPxY);
    const ctx = canvas.getContext("2d");

    // Paint the ground first: a sliver no pass reached would otherwise be
    // transparent rather than board-coloured.
    ctx.fillStyle = "#f4f2ee";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    let done = 0;
    for (const offsetY of ys) {
      for (const offsetX of xs) {
        view.scrollTo(box.x * zoom + offsetX, box.y * zoom + offsetY);
        // Let layout settle, then let the compositor put it on screen and the
        // capture stream deliver that frame.
        await nextFrame();
        await new Promise((resolve) => setTimeout(resolve, 140));
        await nextFrame();

        const surface = $("surface").getBoundingClientRect();
        const area = view.getBoundingClientRect();
        const left = Math.max(area.left, surface.left + box.x * zoom);
        const top = Math.max(area.top, surface.top + box.y * zoom);
        const right = Math.min(area.right, surface.left + (box.x + box.width) * zoom);
        const bottom = Math.min(area.bottom, surface.top + (box.y + box.height) * zoom);

        if (right > left && bottom > top) {
          const sw = Math.round((right - left) * perCssPx);
          const sh = Math.round((bottom - top) * perCssPxY);
          ctx.drawImage(
            video,
            Math.round(left * perCssPx), Math.round(top * perCssPxY), sw, sh,
            Math.round((left - surface.left - box.x * zoom) * perCssPx),
            Math.round((top - surface.top - box.y * zoom) * perCssPxY),
            sw, sh);
        }
        done++;
        if (shots > 1) notify("캡처 " + done + "/" + shots);
      }
    }

    const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
    if (!blob) { notify("캡처 이미지를 만들지 못했습니다"); return; }

    const board = await get("boards", boardId);
    await saveFile(safeFileName(board && board.title, "png"), blob);
  } finally {
    stream.getTracks().forEach((track) => track.stop());
    document.body.classList.remove("capturing");
    zoom = beforeZoom;
    applyZoom();
    view.scrollTo(beforeLeft, beforeTop);
  }
}

/* ==========================================================================
   Add-image dialog
   ========================================================================== */

function openDialog() {
  let tab = "upload";
  const root = $("dialogRoot");

  function close() { root.replaceChildren(); }

  function draw(error) {
    const veil = document.createElement("div");
    veil.className = "veil-full";
    veil.innerHTML =
      '<div class="modal">' +
        '<div class="modal-head"><h3>이미지 추가</h3><button class="x" aria-label="닫기">✕</button></div>' +
        '<div class="tabs">' +
          '<button data-tab="upload" class="' + (tab === "upload" ? "on" : "") + '">직접 업로드</button>' +
          '<button data-tab="link" class="' + (tab === "link" ? "on" : "") + '">링크 가져오기</button>' +
        "</div>" +
        (tab === "upload"
          ? '<button class="drop-zone">클릭해서 파일 선택 (여러 장 가능)</button>' +
            '<p class="fine">보드 위에 파일을 끌어다 놓거나, 복사한 이미지를 붙여넣어도 추가됩니다.</p>'
          : '<form><input class="input" placeholder="https://…" autofocus>' +
            '<button class="btn btn-primary" type="submit" style="width:100%;margin-top:12px">가져오기</button></form>' +
            '<p class="fine">서버 없이 도는 파일이라 <b>이미지 주소를 직접</b> 넣어야 합니다. ' +
            '핀터레스트 핀 페이지 주소는 브라우저가 대신 열어볼 수 없어(CORS) 안 됩니다 — ' +
            '핀에서 이미지를 우클릭해 \'이미지 주소 복사\'를 쓰거나, 그냥 복사해서 보드에 붙여넣으세요.<br>' +
            '인스타그램 게시물·릴스 주소는 <b>임베드 카드</b>로 들어갑니다.</p>') +
        (error
          ? '<div class="err"><b>' + esc(error.message) + "</b>" +
            (error.hint ? esc(error.hint) : "") + "</div>"
          : "") +
      "</div>";

    veil.addEventListener("click", (e) => { if (e.target === veil) close(); });
    veil.querySelector(".x").addEventListener("click", close);
    veil.querySelectorAll("[data-tab]").forEach((button) => {
      button.addEventListener("click", () => { tab = button.dataset.tab; draw(null); });
    });

    const zone = veil.querySelector(".drop-zone");
    if (zone) {
      zone.addEventListener("click", () => {
        const picker = $("filePicker");
        picker.onchange = async () => {
          zone.textContent = "올리는 중…";
          const added = await addFiles(Array.from(picker.files));
          picker.value = "";
          if (added) close(); else draw(new Err("이미지 파일이 없습니다."));
        };
        picker.click();
      });
    }

    const form = veil.querySelector("form");
    if (form) {
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const input = form.querySelector("input");
        const submit = form.querySelector("button");
        if (!input.value.trim()) return;
        submit.disabled = true;
        submit.textContent = "가져오는 중…";
        try {
          const entry = await importUrl(input.value);
          if (entry.kind === "image" && entry.blobId) {
            const size = await measure(await blobUrl(entry.blobId));
            entry.ratio = size.w > 0 ? size.h / size.w : 0.7;
          } else if (entry.kind === "image" && entry.remoteUrl) {
            const size = await measure(entry.remoteUrl);
            entry.ratio = size.w > 0 ? size.h / size.w : 0.7;
          }
          await addImported([entry]);
          close();
        } catch (e) {
          draw(e instanceof Err ? e : new Err(e.message || "가져오지 못했습니다."));
        }
      });
    }

    root.replaceChildren(veil);
  }

  draw(null);
}

/* ==========================================================================
   Wiring and routing
   ========================================================================== */

$("newBoard").addEventListener("submit", async (event) => {
  event.preventDefault();
  const title = $("newTitle").value.trim();
  if (!title) return;
  const now = new Date().toISOString();
  const board = { id: uid(), title: title.slice(0, 120), createdAt: now, updatedAt: now };
  await put("boards", board);
  scheduleSync();
  $("newTitle").value = "";
  location.hash = "#/board/" + board.id;
});

$("btnZoomIn").addEventListener("click", () => stepZoom(1));
$("btnZoomOut").addEventListener("click", () => stepZoom(-1));
$("btnZoomReset").addEventListener("click", () => setZoom(1));
$("btnZoomFit").addEventListener("click", zoomToFit);

// Ctrl/⌘ + wheel is the zoom gesture every canvas app uses; a trackpad pinch
// arrives the same way.
$("scroll").addEventListener("wheel", (event) => {
  if (!event.ctrlKey && !event.metaKey) return;
  event.preventDefault();
  setZoom(zoom * (event.deltaY < 0 ? 1.12 : 1 / 1.12), event.clientX, event.clientY);
}, { passive: false });

for (const id of ["btnUndo", "btnUndoHome"]) $(id).addEventListener("click", undo);
for (const id of ["btnRedo", "btnRedoHome"]) $(id).addEventListener("click", redo);
$("btnExportPng").addEventListener("click", exportBoardImage);
$("btnCapture").addEventListener("click", captureBoardImage);
$("btnSave").addEventListener("click", saveNow);
$("btnSaveHome").addEventListener("click", saveNow);
$("btnAddImage").addEventListener("click", openDialog);
$("btnAddNote").addEventListener("click", async () => {
  const size = { width: 240, height: 180 };
  const at = dropPoint(size);
  const note = await addItem({ kind: "note", x: at.x, y: at.y, ...size, text: "" });
  recordAdd([note], "메모 추가");
  startEditing(note);
});

$("btnFolder").addEventListener("click", connectFolder);
$("btnFolderOff").addEventListener("click", disconnectFolder);
$("btnReload").addEventListener("click", async () => {
  const snap = await readFolder();
  if (!snap) { alert("폴더에서 데이터를 읽지 못했습니다."); return; }
  await applySnapshot(snap);
  await renderHome();
});
$("btnExport").addEventListener("click", exportAll);
$("btnImport").addEventListener("click", () => {
  const picker = $("importPicker");
  picker.onchange = async () => {
    if (picker.files[0]) await importAll(picker.files[0]);
    picker.value = "";
  };
  picker.click();
});

async function route() {
  const match = location.hash.match(/^#\/board\/(.+)$/);
  if (match) {
    await openBoard(match[1]);
  } else {
    if (boardId) closeBoard();
    await renderHome();
  }
}

window.addEventListener("hashchange", route);

(async function boot() {
  db = await openDb();
  await loadFolderHandle();

  // A connected folder is the source of truth; pick up edits made elsewhere.
  if (folder && (await folderReady(false))) {
    const snap = await readFolder();
    if (snap) await applySnapshot(snap);
  }
  await route();
  paintHistory();

  // Test seam: lets the browser suite drive sync with a real directory handle.
  window.__mb = { db, writeFolder, readFolder, applySnapshot, exportAll,
                  setFolder: (handle) => { folder = handle; paintSync(); },
                  saveNow, undo, redo,
                  history: () => ({ past: history.past.map((e) => e.label),
                                    future: history.future.map((e) => e.label) }),
                  state: () => ({ boardId, items, selection: [...selection], editingId }) };
})();
</script>
