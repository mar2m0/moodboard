<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>무드보드</title>
<style>
  :root {
    --bg: #fbfaf8;
    --canvas: #f4f2ee;
    --ink: #1c1a17;
    --muted: #8b8579;
    --line: #e3ddd3;
    --accent: #1c1a17;
    --note-size: 13px;
    --note-lh: 1.6;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard",
                 "Malgun Gothic", system-ui, sans-serif;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: inherit; }

  .btn {
    border: 1px solid var(--line); background: #fff; border-radius: 8px;
    padding: 8px 14px; font-size: 13px; white-space: nowrap;
  }
  .btn:hover { border-color: var(--ink); }
  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-primary:hover { opacity: .88; }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn-sm { padding: 5px 10px; font-size: 12px; }

  .input {
    border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px;
    font-size: 14px; background: #fff; outline: none; width: 100%;
  }
  .input:focus { border-color: var(--ink); }

  /* ---- board list ---- */
  #home { max-width: 980px; margin: 0 auto; padding: 56px 24px 80px; }
  #home h1 { font-size: 28px; margin: 0 0 6px; letter-spacing: -.02em; }
  .sub { color: var(--muted); font-size: 13px; line-height: 1.7; margin: 0 0 28px; }
  .new-form { display: flex; gap: 8px; margin-bottom: 28px; }
  .grid { list-style: none; padding: 0; margin: 0; display: grid; gap: 20px;
          grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  .card { position: relative; border: 1px solid var(--line); border-radius: 12px;
          overflow: hidden; background: #fff; text-decoration: none; display: block; }
  .card:hover { border-color: var(--muted); }
  .thumbs { aspect-ratio: 4/3; display: grid; grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr; gap: 1px; background: #f0ece5; }
  .thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* Fill the tile whatever the count is, instead of leaving empty cells. */
  .thumbs.n1 img { grid-column: span 2; grid-row: span 2; }
  .thumbs.n2 img { grid-row: span 2; }
  .thumbs.n3 img:first-child { grid-row: span 2; }
  .thumbs .empty { grid-column: span 2; grid-row: span 2; display: grid;
                   place-items: center; color: #cfc8bd; font-size: 12px; }
  .card-body { padding: 12px 14px; }
  .card-title { font-size: 14px; font-weight: 600; margin: 0;
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-meta { font-size: 12px; color: var(--muted); margin: 3px 0 0; }
  .card-del { position: absolute; top: 8px; right: 8px; display: none;
              background: rgba(255,255,255,.94); border: 1px solid var(--line);
              border-radius: 6px; padding: 3px 8px; font-size: 11px; }
  li:hover .card-del { display: block; }
  .card-del:hover { color: #c0392b; }
  .empty-note { border: 1px dashed var(--line); border-radius: 12px; padding: 64px 24px;
                text-align: center; color: #b5ada1; font-size: 13px; }

  /* ---- board canvas ---- */
  #board { display: none; height: 100%; flex-direction: column; }
  #board.on { display: flex; }
  #home.off { display: none; }
  .bar { display: flex; align-items: center; gap: 12px; padding: 10px 16px;
         border-bottom: 1px solid var(--line); background: #fff; flex: none; }
  .bar h2 { font-size: 14px; margin: 0; font-weight: 600;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar .spacer { margin-left: auto; }
  .link { font-size: 13px; color: var(--muted); text-decoration: none; white-space: nowrap; }
  .link:hover { color: var(--ink); }
  #status { font-size: 12px; color: var(--muted); }
  .zoom { display: flex; gap: 4px; align-items: center; }
  .zoom .btn { min-width: 34px; text-align: center; }
  #btnZoomReset { min-width: 56px; font-variant-numeric: tabular-nums; }

  #scroll { flex: 1; overflow: auto; position: relative; }
  /* The surface is scaled; the sizer carries the scaled footprint so the
     scrollbars stay honest. */
  #sizer { position: relative; }
  #surface {
    position: absolute; left: 0; top: 0; width: 4000px; height: 3000px;
    transform-origin: 0 0;
    background-color: var(--canvas);
    background-image: radial-gradient(circle, #d8d3ca 1px, transparent 1px);
    background-size: 24px 24px;
  }
  #surface.drop { box-shadow: inset 0 0 0 2px var(--ink); }
  body.capturing .bar, body.capturing .tools, body.capturing .handle,
  body.capturing .linkmark, body.capturing .remote-tag { visibility: hidden; }
  body.capturing .item.sel { outline: none; }
  #marquee { position: absolute; border: 1px solid var(--ink);
             background: rgba(28,26,23,.07); pointer-events: none; z-index: 9999; }
  #hint { position: absolute; left: 50%; top: 140px; transform: translateX(-50%);
          text-align: center; color: #b5ada1; font-size: 13px; line-height: 1.9;
          pointer-events: none; }

  .item { position: absolute; touch-action: none; }
  .item.sel { outline: 2px solid var(--ink); outline-offset: 3px; }
  .item img { width: 100%; height: 100%; object-fit: cover; display: block;
              border-radius: 6px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.1);
              user-select: none; -webkit-user-drag: none; }
  /* Reading and writing share one set of text metrics, so switching between
     them moves nothing on screen. */
  .note { width: 100%; height: 100%; border-radius: 6px; border: 1px solid;
          padding: 12px; font-family: inherit; font-size: var(--note-size);
          line-height: var(--note-lh); letter-spacing: normal; overflow: auto;
          box-shadow: 0 1px 3px rgba(0,0,0,.08); word-break: break-word;
          white-space: pre-wrap; }
  .note.ph { color: #b5ada1; }
  textarea.note { display: block; resize: none; outline: none; white-space: pre-wrap;
                  font-family: inherit; font-size: var(--note-size);
                  line-height: var(--note-lh); letter-spacing: normal; color: inherit; }
  textarea.note::placeholder { color: #b5ada1; }

  .embed { width: 100%; height: 100%; display: flex; flex-direction: column;
           background: #fff; border: 1px solid var(--line); border-radius: 6px;
           overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .embed .frame { position: relative; flex: 1; min-height: 0; }
  .embed iframe { width: 100%; height: 100%; border: 0; }
  .embed .veil { position: absolute; inset: 0; }
  .embed .cap { flex: none; display: flex; align-items: center; justify-content: space-between;
                gap: 8px; border-top: 1px solid var(--line); padding: 6px 10px;
                font-size: 11px; color: var(--muted); }
  .embed .cap span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .handle { position: absolute; right: -7px; bottom: -7px; width: 15px; height: 15px;
            border-radius: 50%; background: var(--ink); border: 2px solid #fff;
            cursor: se-resize; }
  .tools { position: absolute; top: -36px; left: 0; display: flex; align-items: center;
           gap: 4px; background: var(--ink); color: #fff; border-radius: 8px;
           padding: 5px 7px; font-size: 12px; box-shadow: 0 4px 12px rgba(0,0,0,.25); }
  .tools .act { background: none; border: 0; color: #fff; padding: 2px 6px; font-size: 12px; }
  .tools .act:hover { color: #ff9c8f; }
  .tools a { color: #fff; padding: 0 6px; max-width: 200px; overflow: hidden;
             text-overflow: ellipsis; white-space: nowrap; }
  .tools .sep { width: 1px; height: 14px; background: rgba(255,255,255,.25); }
  .tools .count { padding: 0 4px; opacity: .75; }
  /* Swatch colours are set inline from the palette, so nothing here may set
     `background` — an earlier rule doing that made every swatch invisible. */
  .swatch { width: 16px; height: 16px; border-radius: 50%; padding: 0;
            border: 1px solid rgba(0,0,0,.25); }
  .swatch.on { box-shadow: 0 0 0 2px #fff; }
  .palette { position: absolute; top: calc(100% + 6px); left: 0; display: grid;
             grid-template-columns: repeat(6, 16px); gap: 6px; background: var(--ink);
             padding: 8px; border-radius: 8px; box-shadow: 0 4px 12px rgba(0,0,0,.25); }
  .remote-tag { position: absolute; left: 6px; bottom: 6px; background: rgba(28,26,23,.82);
                color: #fff; font-size: 10px; padding: 3px 7px; border-radius: 4px;
                border: 0; font-family: inherit; }
  .remote-tag:hover { background: var(--ink); }

  /* A caption sits under the item without changing the item's own box, so
     resizing an image never fights with the length of its caption. */
  /* The plate matches the canvas, so it is invisible over empty board and keeps
     the caption readable when it happens to fall over another item. */
  .caption { position: absolute; top: 100%; left: 0; width: 100%; margin-top: 6px;
             font-size: 12px; line-height: 1.5; color: #6f6a5f; white-space: pre-wrap;
             word-break: break-word; background: rgba(244,242,238,.92);
             border-radius: 4px; padding: 2px 5px; }
  .caption.ph { color: #b5ada1; font-style: italic; }
  textarea.caption { border: 1px solid var(--line); border-radius: 5px; background: #fff;
                     padding: 5px 7px; resize: none; outline: none; font-family: inherit;
                     min-height: 52px; }
  .linkmark { position: absolute; right: 6px; top: 6px; width: 20px; height: 20px;
              display: grid; place-items: center; border-radius: 50%;
              background: rgba(28,26,23,.82); color: #fff; font-size: 11px;
              text-decoration: none; }
  .linkmark:hover { background: var(--ink); }

  /* ---- dialog ---- */
  .veil-full { position: fixed; inset: 0; background: rgba(0,0,0,.32); display: grid;
               place-items: center; padding: 16px; z-index: 100; }
  .modal { width: 100%; max-width: 460px; background: #fff; border-radius: 12px;
           padding: 22px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  .modal h3 { margin: 0; font-size: 15px; }
  .modal-head { display: flex; align-items: center; justify-content: space-between;
                margin-bottom: 18px; }
  .x { background: none; border: 0; color: var(--muted); font-size: 16px; }
  .tabs { display: flex; gap: 4px; background: #f2efe9; border-radius: 9px; padding: 4px;
          margin-bottom: 18px; }
  .tabs button { flex: 1; border: 0; background: none; border-radius: 6px; padding: 7px;
                 font-size: 13px; color: var(--muted); }
  .tabs button.on { background: #fff; color: var(--ink); font-weight: 600;
                    box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .drop-zone { width: 100%; border: 1px dashed var(--line); border-radius: 10px;
               padding: 40px 16px; background: none; color: var(--muted); font-size: 13px; }
  .drop-zone:hover { border-color: var(--ink); color: var(--ink); }
  .fine { font-size: 12px; color: var(--muted); line-height: 1.75; margin: 12px 0 0; }
  .err { margin-top: 14px; background: #fdeeec; color: #a03127; border-radius: 8px;
         padding: 10px 12px; font-size: 12px; line-height: 1.65; }
  .err b { display: block; margin-bottom: 3px; }

  /* Remote-link repair list: each row shows the picture the browser can render
     but not read, so matching a file to the right row is a visual job. */
  .fixlist { display: flex; flex-direction: column; gap: 10px; max-height: 46vh;
             overflow: auto; margin: 4px 0 0; }
  .fixrow { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line);
            border-radius: 9px; padding: 8px; }
  .fixrow img { width: 56px; height: 42px; object-fit: cover; border-radius: 5px;
                background: #f0ece5; flex: none; }
  .fixrow .meta { flex: 1; min-width: 0; font-size: 12px; }
  .fixrow .meta b { display: block; font-weight: 600; overflow: hidden;
                    text-overflow: ellipsis; white-space: nowrap; }
  .fixrow .meta span { color: var(--muted); }
  .fixrow.done { border-color: #b8d9b2; background: #f3f9f1; }
  .fixrow.done .meta span { color: #4a9d5f; }

  /* ---- sync bar ---- */
  #sync { display: flex; align-items: center; gap: 10px; padding: 8px 16px;
          border-bottom: 1px solid var(--line); background: #fff;
          font-size: 12px; color: var(--muted); flex: none; }
  #sync .dot { width: 7px; height: 7px; border-radius: 50%; background: #cfc8bd; flex: none; }
  #sync .dot.live { background: #4a9d5f; }
  #sync .grow { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #homeSaved, #status { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>

<main id="home">
  <h1>무드보드</h1>
  <p class="sub">
    보드를 만들고 이미지와 메모를 자유롭게 배치하세요.
    이미지는 업로드 · 링크 · 붙여넣기로 추가할 수 있습니다.<br>
    데이터는 이 브라우저 안에 저장됩니다. 다른 컴퓨터에서도 쓰려면 아래 저장 폴더를 연결하거나 내보내기를 쓰세요.
  </p>

  <div id="sync">
    <span class="dot" id="syncDot"></span>
    <span class="grow" id="syncText">저장 폴더 없음 — 이 브라우저에만 저장됩니다</span>
    <button class="btn btn-sm" id="btnFolder">저장 폴더 연결</button>
    <button class="btn btn-sm" id="btnFolderOff" hidden>연결 해제</button>
    <button class="btn btn-sm" id="btnReload" hidden>폴더에서 다시 읽기</button>
    <button class="btn btn-sm" id="btnUndoHome" title="되돌리기 (Ctrl/⌘+Z)" disabled>↶</button>
    <button class="btn btn-sm" id="btnRedoHome" title="다시 실행 (Ctrl/⌘+Shift+Z)" disabled>↷</button>
    <button class="btn btn-sm" id="btnSaveHome">저장</button>
    <span id="homeSaved"></span>
    <button class="btn btn-sm" id="btnExport">내보내기</button>
    <button class="btn btn-sm" id="btnImport">가져오기</button>
  </div>

  <form class="new-form" id="newBoard">
    <input class="input" id="newTitle" placeholder="새 보드 이름 (예: 2026 봄 컬러)" maxlength="120">
    <button class="btn btn-primary" type="submit">보드 만들기</button>
  </form>

  <div id="boardList"></div>
</main>

<section id="board">
  <div class="bar">
    <a class="link" href="#/" id="backLink">← 보드 목록</a>
    <h2 id="boardTitle"></h2>
    <span class="spacer"></span>
    <span id="status"></span>
    <span class="zoom">
      <button class="btn btn-sm" id="btnZoomOut" title="축소 (Ctrl/⌘+-)">−</button>
      <button class="btn btn-sm" id="btnZoomReset" title="100%로 (Ctrl/⌘+0)">100%</button>
      <button class="btn btn-sm" id="btnZoomIn" title="확대 (Ctrl/⌘++)">+</button>
      <button class="btn btn-sm" id="btnZoomFit" title="전체 보기">맞춤</button>
    </span>
    <button class="btn btn-sm" id="btnUndo" title="되돌리기 (Ctrl/⌘+Z)" disabled>↶</button>
    <button class="btn btn-sm" id="btnRedo" title="다시 실행 (Ctrl/⌘+Shift+Z)" disabled>↷</button>
    <button class="btn btn-sm" id="btnExportPng" title="보드를 다시 그려 PNG로 저장">이미지로</button>
    <button class="btn btn-sm" id="btnCapture" title="화면에 보이는 대로 캡처 — 원격 이미지와 임베드까지 담깁니다">캡처</button>
    <button class="btn btn-sm" id="btnSave" title="저장 (Ctrl/⌘+S)">저장</button>
    <button class="btn btn-primary btn-sm" id="btnAddImage">이미지 추가</button>
    <button class="btn btn-sm" id="btnAddNote">메모 추가</button>
  </div>
  <div id="scroll"><div id="sizer"><div id="surface"></div></div></div>
</section>

<input type="file" id="filePicker" accept="image/*" multiple hidden>
<input type="file" id="importPicker" accept="application/json,.json" hidden>
<div id="dialogRoot"></div>

<script>
"use strict";

/* ==========================================================================
   Storage — IndexedDB. On file:// every page shares one origin, so the store
   name is namespaced; moving or renaming this file keeps the data.
   ========================================================================== */

const DB_NAME = "moodboard-standalone";
const STORES = ["boards", "items", "blobs", "meta"];
let db = null;

function openDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => {
      const d = req.result;
      if (!d.objectStoreNames.contains("boards")) d.createObjectStore("boards", { keyPath: "id" });
      if (!d.objectStoreNames.contains("items")) {
        d.createObjectStore("items", { keyPath: "id" }).createIndex("boardId", "boardId");
      }
      if (!d.objectStoreNames.contains("blobs")) d.createObjectStore("blobs", { keyPath: "id" });
      if (!d.objectStoreNames.contains("meta")) d.createObjectStore("meta", { keyPath: "key" });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function tx(store, mode, run) {
  return new Promise((resolve, reject) => {
    const t = db.transaction(store, mode);
    const result = run(t.objectStore(store));
    t.oncomplete = () => resolve(result && result.__req ? result.__req.result : result);
    t.onerror = () => reject(t.error);
    t.onabort = () => reject(t.error);
  });
}

const get = (store, key) => tx(store, "readonly", (s) => ({ __req: s.get(key) }));
const put = (store, value) => tx(store, "readwrite", (s) => { s.put(value); return value; });
const del = (store, key) => tx(store, "readwrite", (s) => { s.delete(key); });
const all = (store) => tx(store, "readonly", (s) => ({ __req: s.getAll() }));
const clearStore = (store) => tx(store, "readwrite", (s) => { s.clear(); });

function itemsOfBoard(boardId) {
  return tx("items", "readonly", (s) => ({ __req: s.index("boardId").getAll(boardId) }));
}

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 9);

/* ==========================================================================
   Blob store and object URLs
   ========================================================================== */

const urlCache = new Map();

async function blobUrl(blobId) {
  if (urlCache.has(blobId)) return urlCache.get(blobId);
  const row = await get("blobs", blobId);
  if (!row) return "";
  const url = URL.createObjectURL(row.blob);
  urlCache.set(blobId, url);
  return url;
}

function forgetUrls() {
  urlCache.forEach((url) => URL.revokeObjectURL(url));
  urlCache.clear();
}

const EXT = { "image/jpeg": "jpg", "image/png": "png", "image/gif": "gif",
              "image/webp": "webp", "image/avif": "avif", "image/svg+xml": "svg" };

async function saveBlob(blob) {
  const id = uid();
  await put("blobs", { id, blob, type: blob.type, size: blob.size });
  return id;
}

/** Reads intrinsic size so a new image can be placed at the right ratio. */
function measure(url) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve({ w: img.naturalWidth, h: img.naturalHeight });
    img.onerror = () => resolve({ w: 0, h: 0 });
    img.src = url;
  });
}

/* ==========================================================================
   Instagram — the image itself can't be fetched (signed, expiring CDN URLs
   behind a login wall), but a public post renders in Instagram's own iframe.
   ========================================================================== */

const INSTAGRAM_HOSTS = new Set(["instagram.com", "www.instagram.com", "instagr.am", "ig.me"]);

function parseInstagram(raw) {
  let url;
  try { url = new URL(raw); } catch { return null; }
  if (!INSTAGRAM_HOSTS.has(url.hostname.toLowerCase())) return null;

  const parts = url.pathname.split("/").filter(Boolean);
  const at = parts.findIndex((p) => p === "p" || p === "reel" || p === "tv");
  if (at === -1) return { notAPost: true };

  const code = parts[at + 1];
  if (!code || !/^[A-Za-z0-9_-]+$/.test(code)) return { notAPost: true };

  const type = parts[at] === "reel" ? "reel" : "p";
  const user = at > 0 ? parts[at - 1] : "";
  return {
    embedUrl: "https://www.instagram.com/" + type + "/" + code + "/embed/",
    sourceUrl: "https://www.instagram.com/" + type + "/" + code + "/",
    label: user ? "Instagram · @" + user : "Instagram",
  };
}

/* ==========================================================================
   Link import. Without a server we can't read a page's og:image (CORS), so a
   link must point at the image itself. We still try to fetch the bytes so the
   image survives the original going away; when CORS refuses, we fall back to
   displaying the remote URL and mark the item as a fragile remote link.
   ========================================================================== */

async function importUrl(raw) {
  const trimmed = raw.trim();
  let url;
  try { url = new URL(trimmed); } catch { throw new Err("올바른 URL이 아닙니다."); }
  if (url.protocol !== "http:" && url.protocol !== "https:") {
    throw new Err("http/https 링크만 넣을 수 있습니다.");
  }

  const insta = parseInstagram(trimmed);
  if (insta && insta.notAPost) {
    throw new Err("인스타그램 게시물 주소가 아닙니다.",
      "프로필이 아니라 게시물·릴스 주소(.../p/... 또는 .../reel/...)를 넣어 주세요. " +
      "이미지 자체를 넣고 싶다면 복사해서 보드에 Ctrl+V(⌘V)로 붙여넣으면 됩니다.");
  }
  if (insta) {
    return { kind: "embed", src: insta.embedUrl, sourceUrl: insta.sourceUrl, label: insta.label };
  }

  // Try to take a permanent copy of the bytes.
  try {
    const res = await fetch(trimmed, { mode: "cors" });
    if (res.ok) {
      const blob = await res.blob();
      if (blob.type.startsWith("image/")) {
        return { kind: "image", blobId: await saveBlob(blob), sourceUrl: trimmed,
                 label: url.hostname.replace(/^www\./, "") };
      }
    }
  } catch { /* CORS or network — fall through to the remote-link path */ }

  // Can the browser at least display it?
  const ok = await new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(true);
    img.onerror = () => resolve(false);
    img.src = trimmed;
  });
  if (!ok) {
    throw new Err("이미지를 불러오지 못했습니다.",
      "이 주소가 이미지 파일을 직접 가리키는지 확인해 주세요. 웹페이지 주소는 서버 없이 대표 이미지를 " +
      "읽을 수 없습니다(CORS). 이미지를 우클릭해 '이미지 주소 복사'로 얻은 링크를 넣거나, 그냥 복사해서 " +
      "보드에 붙여넣어 주세요.");
  }
  // Displayable but unreadable: the host serves the picture to an <img> but
  // won't let a page read its bytes, so we can only keep the address.
  notify("이 호스트는 이미지 복사를 막습니다 — 주소만 저장했습니다 (내보내기에는 안 담깁니다)");
  return { kind: "image", remoteUrl: trimmed, sourceUrl: trimmed,
           label: url.hostname.replace(/^www\./, "") };
}

class Err extends Error {
  constructor(message, hint) { super(message); this.hint = hint; }
}

/* ==========================================================================
   Saving a generated file. Opened as a local file the page hands the browser a
   download; published as an Artifact the frame is sandboxed and can't, so it
   asks the viewer through the downloads capability instead. One source, both
   homes.
   ========================================================================== */

let downloadsNs = null;

const capabilitiesReady = (async () => {
  try {
    if (window.claude && typeof window.claude.use === "function") {
      downloadsNs = await window.claude.use("downloads");
    }
  } catch { downloadsNs = null; }
})();

/** True only where the File System Access API can actually reach a folder. */
const canUseFolder = typeof window.showDirectoryPicker === "function" && window.self === window.top;

async function saveFile(filename, data) {
  await capabilitiesReady;

  if (downloadsNs) {
    try {
      await downloadsNs.save({ filename, data });
      notify("저장했습니다");
    } catch (err) {
      const code = err && err.code;
      if (code === "declined") notify("저장을 취소했습니다");
      else if (code === "too_large") notify("파일이 16MB를 넘어 저장할 수 없습니다");
      else if (code === "rate_limited") notify("잠시 후 다시 눌러 주세요");
      else notify("저장하지 못했습니다");
    }
    return;
  }

  const blob = data instanceof Blob ? data : new Blob([data], { type: "application/octet-stream" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

/* ==========================================================================
   Optional folder sync. The File System Access API works on file:// in
   Chromium, so pointing this at a Dropbox / Drive / iCloud folder puts the
   data in the cloud while the app itself stays a local file. The folder is
   treated as the source of truth: read on start, written after every change.
   ========================================================================== */

let folder = null;          // FileSystemDirectoryHandle
let syncTimer = null;

async function loadFolderHandle() {
  if (!canUseFolder) { paintSync(); return; }
  const row = await get("meta", "folder");
  folder = row ? row.handle : null;
  paintSync();
}

async function folderReady(prompt) {
  if (!folder) return false;
  const opts = { mode: "readwrite" };
  if ((await folder.queryPermission(opts)) === "granted") return true;
  if (!prompt) return false;
  return (await folder.requestPermission(opts)) === "granted";
}

async function connectFolder() {
  let picked;
  try {
    picked = await window.showDirectoryPicker({ mode: "readwrite", id: "moodboard" });
  } catch (e) {
    if (e && e.name === "AbortError") return;         // user closed the picker
    alert("이 브라우저는 폴더 연결을 지원하지 않습니다. 크롬/엣지에서 열거나 내보내기를 사용해 주세요.");
    return;
  }
  folder = picked;
  await put("meta", { key: "folder", handle: picked });

  const existing = await readFolder();
  if (existing) {
    const ok = confirm(
      "이 폴더에 이미 무드보드 데이터가 있습니다 (보드 " + existing.boards.length + "개).\n\n" +
      "확인 = 폴더 내용으로 바꾸기 (지금 이 브라우저의 내용은 사라집니다)\n" +
      "취소 = 지금 이 브라우저의 내용을 폴더에 덮어쓰기");
    if (ok) await applySnapshot(existing);
    else await writeFolder();
  } else {
    await writeFolder();
  }
  paintSync();
  await renderHome();
}

async function disconnectFolder() {
  folder = null;
  await del("meta", "folder");
  paintSync();
}

function scheduleSync() {
  if (!folder) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => {
    writeFolder().then((ok) => ok && notify("폴더에 저장됨")).catch(() => notify("폴더 저장 실패"));
  }, 700);
}

/**
 * Every edit is already written to IndexedDB as it happens; this flushes the
 * note being typed and the debounced folder write, so "저장" means the same
 * thing it does everywhere else.
 */
async function saveNow() {
  clearTimeout(noteTimer);
  clearTimeout(syncTimer);

  if (editingId) {
    const item = items.find((i) => i.id === editingId);
    const el = nodes.get(editingId);
    const editor = el && el.querySelector("textarea.note");
    if (item && editor) { item.text = editor.value; await put("items", item); }
  }

  if (!folder) { notify("이 브라우저에 저장됨"); return; }
  notify("저장 중…");
  const ok = await writeFolder(true).catch(() => false);
  notify(ok ? "폴더에 저장됨" : "폴더에 저장하지 못했습니다 — 권한을 확인해 주세요");
}

async function writeFolder(prompt) {
  if (!(await folderReady(!!prompt))) return false;
  const boards = await all("boards");
  const items = await all("items");
  const blobs = await all("blobs");

  await writeFile(folder, "moodboard.json",
    new Blob([JSON.stringify({ format: "moodboard/v1", savedAt: new Date().toISOString(),
                               boards, items }, null, 2)], { type: "application/json" }));

  const dir = await folder.getDirectoryHandle("images", { create: true });
  const present = new Set();
  for await (const name of dir.keys()) present.add(name);
  for (const row of blobs) {
    const name = row.id + "." + (EXT[row.type] || "bin");
    // Content never changes for a given id, so an existing file is already right.
    if (!present.has(name)) await writeFile(dir, name, row.blob);
  }
  return true;
}

async function writeFile(dir, name, blob) {
  const handle = await dir.getFileHandle(name, { create: true });
  const stream = await handle.createWritable();
  await stream.write(blob);
  await stream.close();
}

async function readFolder() {
  if (!(await folderReady(true))) return null;
  let text;
  try {
    const handle = await folder.getFileHandle("moodboard.json");
    text = await (await handle.getFile()).text();
  } catch { return null; }

  let parsed;
  try { parsed = JSON.parse(text); } catch { return null; }
  if (!parsed || !Array.isArray(parsed.boards)) return null;

  const blobs = [];
  try {
    const dir = await folder.getDirectoryHandle("images");
    for await (const [name, handle] of dir.entries()) {
      if (handle.kind !== "file") continue;
      const file = await handle.getFile();
      blobs.push({ id: name.replace(/\.[^.]+$/, ""), blob: file, type: file.type, size: file.size });
    }
  } catch { /* no images yet */ }

  return { boards: parsed.boards, items: parsed.items || [], blobs };
}

/** Replaces everything held locally with a snapshot from a folder or a file. */
async function applySnapshot(snap) {
  forgetUrls();
  await clearStore("boards");
  await clearStore("items");
  await clearStore("blobs");
  for (const b of snap.boards) await put("boards", b);
  for (const i of snap.items) await put("items", i);
  for (const bl of snap.blobs) await put("blobs", bl);
}

function paintSync() {
  const dot = $("syncDot");
  const text = $("syncText");
  dot.classList.toggle("live", !!folder);

  if (!canUseFolder) {
    text.textContent = "이 브라우저에 저장됩니다 — 다른 기기로 옮기려면 내보내기를 쓰세요";
    $("btnFolder").hidden = true;
    $("btnFolderOff").hidden = true;
    $("btnReload").hidden = true;
    return;
  }

  text.textContent = folder
    ? "저장 폴더: " + folder.name + " — 변경할 때마다 이 폴더에 저장됩니다"
    : "저장 폴더 없음 — 이 브라우저에만 저장됩니다";
  $("btnFolder").hidden = !!folder;
  $("btnFolderOff").hidden = !folder;
  $("btnReload").hidden = !folder;
}

/* ==========================================================================
   Export / import — one JSON file, images inlined. Works in every browser,
   and is the fallback when folder sync isn't available.
   ========================================================================== */

const toDataUrl = (blob) => new Promise((resolve) => {
  const reader = new FileReader();
  reader.onload = () => resolve(reader.result);
  reader.readAsDataURL(blob);
});

async function exportAll() {
  const boards = await all("boards");
  const items = await all("items");
  const blobs = await all("blobs");
  const images = {};
  for (const row of blobs) images[row.id] = await toDataUrl(row.blob);

  const payload = { format: "moodboard/v1", exportedAt: new Date().toISOString(),
                    boards, items, images };
  await saveFile(safeFileName("", "json"), JSON.stringify(payload));
}

async function importAll(file) {
  let parsed;
  try { parsed = JSON.parse(await file.text()); } catch { alert("읽을 수 없는 파일입니다."); return; }
  if (!parsed || !Array.isArray(parsed.boards)) { alert("무드보드 내보내기 파일이 아닙니다."); return; }
  if (!confirm("가져오면 지금 이 브라우저의 보드가 모두 대체됩니다. 계속할까요?")) return;

  const blobs = [];
  for (const [id, dataUrl] of Object.entries(parsed.images || {})) {
    const blob = await (await fetch(dataUrl)).blob();
    blobs.push({ id, blob, type: blob.type, size: blob.size });
  }
  await applySnapshot({ boards: parsed.boards, items: parsed.items || [], blobs });
  scheduleSync();
  await renderHome();
  alert("보드 " + parsed.boards.length + "개를 가져왔습니다.");
}

/* ==========================================================================
   Board list
   ========================================================================== */

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;",
                                                          ">": "&gt;", '"': "&quot;" }[c]));

/** Transient message, shown in whichever bar the user is currently looking at. */
function notify(text) {
  for (const id of ["status", "homeSaved"]) {
    const el = $(id);
    if (!el) continue;
    el.textContent = text || "";
    if (text) {
      setTimeout(() => { if (el.textContent === text) el.textContent = ""; }, 2500);
    }
  }
}

const setStatus = notify;

const fmtDate = (iso) =>
  new Date(iso).toLocaleDateString("ko-KR", { year: "numeric", month: "long", day: "numeric" });

async function renderHome() {
  const boards = (await all("boards")).sort((a, b) => b.updatedAt.localeCompare(a.updatedAt));
  const host = $("boardList");

  if (boards.length === 0) {
    host.innerHTML = '<p class="empty-note">아직 보드가 없습니다. 위에서 첫 보드를 만들어 보세요.</p>';
    return;
  }

  const list = document.createElement("ul");
  list.className = "grid";
  for (const board of boards) {
    const items = await itemsOfBoard(board.id);
    const pictures = items.filter((i) => i.kind === "image").slice(0, 4);
    const sources = [];
    for (const picture of pictures) {
      sources.push(picture.blobId ? await blobUrl(picture.blobId) : picture.remoteUrl);
    }

    const li = document.createElement("li");
    li.innerHTML =
      '<a class="card" href="#/board/' + board.id + '">' +
        '<div class="thumbs n' + sources.length + '">' +
          (sources.length === 0
            ? '<div class="empty">비어 있음</div>'
            : sources.map((src) => '<img src="' + esc(src) + '" alt="">').join("")) +
        "</div>" +
        '<div class="card-body">' +
          '<p class="card-title">' + esc(board.title) + "</p>" +
          '<p class="card-meta">' + items.length + "개 · " + fmtDate(board.updatedAt) + "</p>" +
        "</div>" +
      "</a>" +
      '<button class="card-del">삭제</button>';

    li.querySelector(".card-del").addEventListener("click", async (event) => {
      event.preventDefault();
      if (!confirm("'" + board.title + "' 보드를 삭제할까요? 안에 있는 이미지와 메모도 함께 사라집니다.\n\n실수로 지웠다면 Ctrl/⌘+Z 로 되돌릴 수 있습니다.")) return;
      const rows = (await itemsOfBoard(board.id)).map(snapshot);
      const boardRow = snapshot(board);
      const ids = rows.map((row) => row.id);

      await delRows(ids);
      await del("boards", board.id);
      scheduleSync();
      await renderHome();

      record({
        label: "'" + board.title + "' 보드 삭제",
        undo: async () => { await put("boards", boardRow); await putRows(rows); },
        redo: async () => { await delRows(ids); await del("boards", boardRow.id); },
      });
    });
    list.appendChild(li);
  }
  host.replaceChildren(list);
}

async function touchBoard(boardId) {
  const board = await get("boards", boardId);
  if (board) { board.updatedAt = new Date().toISOString(); await put("boards", board); }
}

/* ==========================================================================
   Canvas
   ========================================================================== */

const SURFACE = { w: 4000, h: 3000 };
const IMAGE_W = 300;
const EMBED = { width: 340, height: 590 };
const MIN = 80;
const CAPTION_H = 30;
const PALETTE = [
  ["yellow", "#fdf0b8", "#eddc93"],
  ["peach",  "#fde0c8", "#f2c9a4"],
  ["pink",   "#fbdce4", "#f0bfcc"],
  ["rose",   "#f7d2cd", "#e8b3ac"],
  ["purple", "#e6ddf5", "#cfc0e8"],
  ["blue",   "#d7e8f7", "#b6d3ec"],
  ["mint",   "#d2ece7", "#a9d8cf"],
  ["green",  "#d9edd5", "#b8d9b2"],
  ["lime",   "#e8efc4", "#d2dc9c"],
  ["gray",   "#e5e3df", "#ccc8c0"],
];
const COLORS = PALETTE.map((c) => c[0]);
const COLOR_MAP = new Map(PALETTE.map(([name, bg, line]) => [name, { bg, line }]));
COLOR_MAP.set("white", { bg: "#ffffff", line: "#e3ddd3" });   // kept from the first version

(function injectNoteColours() {
  const style = document.createElement("style");
  style.textContent = [...COLOR_MAP].map(([name, c]) =>
    ".note." + name + "{background:" + c.bg + ";border-color:" + c.line + "}").join("\n");
  document.head.appendChild(style);
})();

let boardId = null;
let items = [];
const selection = new Set();
let editingId = null;
let drag = null;
let marquee = null;
let dropStep = 0;
const nodes = new Map();

/* ---- zoom ----
   Items keep their board coordinates; only the surface is scaled. Everything
   that reads a mouse position therefore divides by the current scale. */

let zoom = 1;
const ZOOM_MIN = 0.2;
const ZOOM_MAX = 3;
const ZOOM_STEPS = [0.2, 0.25, 0.33, 0.5, 0.67, 0.8, 1, 1.25, 1.5, 2, 2.5, 3];

function applyZoom() {
  $("surface").style.transform = "scale(" + zoom + ")";
  $("sizer").style.width = SURFACE.w * zoom + "px";
  $("sizer").style.height = SURFACE.h * zoom + "px";
  $("btnZoomReset").textContent = Math.round(zoom * 100) + "%";
}

/** Zooms about a point given in client coordinates, so it stays put. */
function setZoom(next, anchorClientX, anchorClientY) {
  const el = $("scroll");
  const clamped = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, next));
  if (clamped === zoom) return;

  const rect = el.getBoundingClientRect();
  const anchorX = anchorClientX === undefined ? rect.left + el.clientWidth / 2 : anchorClientX;
  const anchorY = anchorClientY === undefined ? rect.top + el.clientHeight / 2 : anchorClientY;
  const boardX = (el.scrollLeft + anchorX - rect.left) / zoom;
  const boardY = (el.scrollTop + anchorY - rect.top) / zoom;

  zoom = clamped;
  applyZoom();
  el.scrollLeft = boardX * zoom - (anchorX - rect.left);
  el.scrollTop = boardY * zoom - (anchorY - rect.top);
}

const stepZoom = (dir, x, y) => {
  const index = ZOOM_STEPS.findIndex((z) => z > zoom + 0.001);
  const next = dir > 0
    ? ZOOM_STEPS[index === -1 ? ZOOM_STEPS.length - 1 : index]
    : ZOOM_STEPS[Math.max(0, (index === -1 ? ZOOM_STEPS.length : index) - 2)];
  setZoom(next, x, y);
};

/** Fits everything on the board into view, or returns to 100% when empty. */
function zoomToFit() {
  const el = $("scroll");
  if (items.length === 0) { setZoom(1); el.scrollTo(0, 0); return; }

  const box = contentBounds(48);
  // Fit only ever zooms out — magnifying a small board is not what "전체 보기" means.
  const scale = Math.min(el.clientWidth / box.width, el.clientHeight / box.height, 1);
  zoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, scale));
  applyZoom();
  el.scrollLeft = box.x * zoom - (el.clientWidth - box.width * zoom) / 2;
  el.scrollTop = box.y * zoom - (el.clientHeight - box.height * zoom) / 2;
}

/** Bounding box of every item on the board, in board coordinates. */
function contentBounds(pad = 0) {
  const left = Math.min(...items.map((i) => i.x));
  const top = Math.min(...items.map((i) => i.y));
  const right = Math.max(...items.map((i) => i.x + i.width));
  const bottom = Math.max(...items.map((i) => i.y + i.height + (i.captionOn ? CAPTION_H : 0)));
  return { x: left - pad, y: top - pad, width: right - left + pad * 2, height: bottom - top + pad * 2 };
}

/** Client coordinates → board coordinates. */
function toBoard(clientX, clientY) {
  const rect = $("surface").getBoundingClientRect();
  return { x: (clientX - rect.left) / zoom, y: (clientY - rect.top) / zoom };
}

/** Centres a new item in the current view, measured against its own size so a
    tall card doesn't land with its resize handle off-screen. */
function dropPoint(size) {
  const el = $("scroll");
  const step = (dropStep++ % 8) * 32;
  return {
    x: Math.max(0, (el.scrollLeft + (el.clientWidth - size.width * zoom) / 2) / zoom + step),
    y: Math.max(0, (el.scrollTop + (el.clientHeight - size.height * zoom) / 2) / zoom + step),
  };
}

async function openBoard(id) {
  const board = await get("boards", id);
  if (!board) { location.hash = "#/"; return; }

  boardId = id;
  selection.clear();
  editingId = null;
  dropStep = 0;
  $("boardTitle").textContent = board.title;
  $("home").classList.add("off");
  $("board").classList.add("on");

  zoom = 1;
  applyZoom();
  items = (await itemsOfBoard(id)).sort((a, b) => a.z - b.z);
  await paintAll();
}

function closeBoard() {
  boardId = null;
  items = [];
  nodes.clear();
  $("surface").replaceChildren();
  $("board").classList.remove("on");
  $("home").classList.remove("off");
}

async function paintAll() {
  const surface = $("surface");
  surface.replaceChildren();
  nodes.clear();

  if (items.length === 0) {
    const hint = document.createElement("p");
    hint.id = "hint";
    hint.innerHTML = "이미지를 끌어다 놓거나, 복사한 이미지를 붙여넣거나(Ctrl/⌘+V),<br>" +
                     "위의 '이미지 추가'로 파일·링크에서 가져오세요.<br>" +
                     "인스타그램 게시물 주소는 임베드 카드로 들어갑니다.";
    surface.appendChild(hint);
  }
  for (const item of items) surface.appendChild(await makeNode(item));
}

async function makeNode(item) {
  const el = document.createElement("div");
  el.className = "item";
  el.dataset.id = item.id;
  place(el, item);

  if (item.kind === "embed") {
    el.innerHTML =
      '<div class="embed">' +
        '<div class="frame">' +
          '<iframe src="' + esc(item.src) + '" title="' + esc(item.sourceLabel || "임베드") + '"' +
          ' loading="lazy" scrolling="no"' +
          ' sandbox="allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox">' +
          "</iframe>" +
          // The frame would otherwise swallow pointer events and the card
          // could never be dragged.
          '<div class="veil"></div>' +
        "</div>" +
        // A cross-origin frame can't be inspected, so a deleted post and a slow
        // load look identical. The caption lives outside the frame and always
        // names the source.
        '<div class="cap"><span>' + esc(item.sourceLabel || "임베드") + "</span>" +
          '<a href="' + esc(item.sourceUrl) + '" target="_blank" rel="noreferrer noopener">원본 열기</a>' +
        "</div>" +
      "</div>";
  } else if (item.kind === "image") {
    const src = item.blobId ? await blobUrl(item.blobId) : item.remoteUrl;
    el.innerHTML = '<img src="' + esc(src) + '" alt="' + esc(item.sourceLabel || "") + '" draggable="false">' +
      (item.remoteUrl
        ? '<button class="remote-tag" title="주소만 저장돼 있어 내보내기에 담기지 않습니다. ' +
          '눌러서 파일로 교체하세요.">원격 링크</button>'
        : "");
  } else {
    el.appendChild(noteView(item));
  }

  decorateExtras(el, item);
  nodes.set(item.id, el);
  if (selection.has(item.id)) refreshSelection();
  return el;
}

/** The caption and the link badge hang off any kind of item. */
function decorateExtras(el, item) {
  el.querySelectorAll(".caption, .linkmark").forEach((node) => node.remove());

  if (item.captionOn) {
    const caption = document.createElement("div");
    caption.className = "caption" + (item.caption ? "" : " ph");
    caption.textContent = item.caption || "더블클릭해서 캡션 입력";
    el.appendChild(caption);
  }

  // Notes show their link in the toolbar; images and embeds get a badge, and an
  // embed already carries its source in the caption strip.
  if (item.sourceUrl && item.kind === "image") {
    const mark = document.createElement("a");
    mark.className = "linkmark";
    mark.href = item.sourceUrl;
    mark.target = "_blank";
    mark.rel = "noreferrer noopener";
    mark.title = item.sourceLabel || item.sourceUrl;
    mark.textContent = "↗";
    el.appendChild(mark);
  }
}

function noteView(item) {
  const view = document.createElement("div");
  view.className = "note view " + (item.color || "yellow") + (item.text ? "" : " ph");
  view.textContent = item.text || "더블클릭해서 메모 입력";
  return view;
}

function place(el, item) {
  el.style.left = item.x + "px";
  el.style.top = item.y + "px";
  el.style.width = item.width + "px";
  el.style.height = item.height + "px";
  el.style.zIndex = item.z;
}

/**
 * Redraws the selection. Only one item at a time carries the toolbar and the
 * resize handle; with several selected the toolbar collapses to a count and a
 * delete, since size and colour are per-item choices.
 */
function refreshSelection() {
  nodes.forEach((el, id) => {
    el.classList.toggle("sel", selection.has(id));
    el.querySelectorAll(":scope > .handle, :scope > .tools").forEach((node) => node.remove());
  });
  if (selection.size === 0) return;

  const chosen = items.filter((i) => selection.has(i.id)).sort((a, b) => a.z - b.z).pop();
  if (!chosen) return;
  const el = nodes.get(chosen.id);
  if (!el) return;

  const tools = document.createElement("div");
  tools.className = "tools";
  tools.addEventListener("pointerdown", (e) => e.stopPropagation());

  if (selection.size === 1) {
    const handle = document.createElement("div");
    handle.className = "handle";
    el.appendChild(handle);

    if (chosen.kind === "note") tools.appendChild(colorControl(chosen, tools));
    if (chosen.kind === "image" && chosen.sourceUrl) {
      const link = document.createElement("a");
      link.href = chosen.sourceUrl;
      link.target = "_blank";
      link.rel = "noreferrer noopener";
      link.textContent = chosen.sourceLabel || "원본 열기";
      tools.appendChild(link);
    }
    if (tools.children.length) tools.appendChild(divider());
    if (chosen.kind === "image") {
      if (chosen.remoteUrl) tools.appendChild(action("저장 시도", () => tryRehost(chosen)));
      tools.appendChild(action("교체", () => pickReplacement(chosen)));
    }
    tools.appendChild(action(chosen.captionOn ? "캡션 숨김" : "캡션", () => toggleCaption(chosen)));
    if (chosen.kind !== "embed") {
      tools.appendChild(action(chosen.sourceUrl ? "링크 수정" : "링크", () => editLink(chosen)));
    }
    tools.appendChild(divider());
    tools.appendChild(action("삭제", () => removeItem(chosen.id)));
  } else {
    const count = document.createElement("span");
    count.className = "count";
    count.textContent = selection.size + "개 선택";
    tools.appendChild(count);
    tools.appendChild(divider());
    tools.appendChild(action("삭제", removeSelected));
  }
  el.appendChild(tools);
}

function action(label, onClick) {
  const button = document.createElement("button");
  button.className = "act";
  button.textContent = label;
  button.addEventListener("click", onClick);
  return button;
}

function divider() {
  const line = document.createElement("span");
  line.className = "sep";
  return line;
}

/** Current colour as a swatch; clicking it opens the full palette. */
function colorControl(item, tools) {
  const current = COLOR_MAP.get(item.color) || COLOR_MAP.get("yellow");
  const button = document.createElement("button");
  button.className = "swatch";
  button.title = "메모 색";
  button.style.background = current.bg;

  button.addEventListener("click", () => {
    const open = tools.querySelector(".palette");
    if (open) { open.remove(); return; }

    const palette = document.createElement("div");
    palette.className = "palette";
    for (const [name, colour] of COLOR_MAP) {
      const swatch = document.createElement("button");
      swatch.className = "swatch" + (name === item.color ? " on" : "");
      swatch.style.background = colour.bg;
      swatch.title = name;
      swatch.addEventListener("click", () => {
        setColor(item.id, name);
        palette.remove();
        button.style.background = colour.bg;
      });
      palette.appendChild(swatch);
    }
    tools.appendChild(palette);
  });
  return button;
}

function setSelection(ids) {
  selection.clear();
  for (const id of ids) selection.add(id);
  refreshSelection();
}

function toggleSelected(id) {
  if (selection.has(id)) selection.delete(id);
  else selection.add(id);
  refreshSelection();
}

/* ==========================================================================
   Undo / redo. Each entry carries the two functions that move the data between
   its before and after state; the view is rebuilt from storage afterwards, so
   an undo can never leave the canvas disagreeing with what was saved.
   ========================================================================== */

const history = { past: [], future: [] };
const HISTORY_LIMIT = 100;

const snapshot = (row) => Object.assign({}, row);
const putRows = async (rows) => { for (const row of rows) await put("items", row); };
const delRows = async (ids) => { for (const id of ids) await del("items", id); };

function record(entry) {
  history.past.push(entry);
  if (history.past.length > HISTORY_LIMIT) history.past.shift();
  history.future.length = 0;   // a new action abandons the redo branch
  paintHistory();
}

async function undo() {
  const entry = history.past.pop();
  if (!entry) { notify("되돌릴 작업이 없습니다"); return; }
  await entry.undo();
  history.future.push(entry);
  await refreshView();
  notify("되돌림 — " + entry.label);
  scheduleSync();
  paintHistory();
}

async function redo() {
  const entry = history.future.pop();
  if (!entry) { notify("다시 실행할 작업이 없습니다"); return; }
  await entry.redo();
  history.past.push(entry);
  await refreshView();
  notify("다시 실행 — " + entry.label);
  scheduleSync();
  paintHistory();
}

/** Rebuilds whichever view is on screen from what is actually stored. */
async function refreshView() {
  if (boardId) {
    const board = await get("boards", boardId);
    if (!board) { location.hash = "#/"; return; }
    items = (await itemsOfBoard(boardId)).sort((a, b) => a.z - b.z);
    const live = new Set(items.map((i) => i.id));
    for (const id of [...selection]) if (!live.has(id)) selection.delete(id);
    await paintAll();
    refreshSelection();
  } else {
    await renderHome();
  }
}

function paintHistory() {
  const undoButtons = [$("btnUndo"), $("btnUndoHome")];
  const redoButtons = [$("btnRedo"), $("btnRedoHome")];
  for (const button of undoButtons) if (button) button.disabled = history.past.length === 0;
  for (const button of redoButtons) if (button) button.disabled = history.future.length === 0;
}

function recordAdd(rows, label) {
  const ids = rows.map((row) => row.id);
  const saved = rows.map(snapshot);
  const owner = boardId;
  record({
    label,
    undo: async () => { await delRows(ids); await touchBoard(owner); },
    redo: async () => { await putRows(saved); await touchBoard(owner); },
  });
}

/** Geometry entries are {id, x, y, width, height} patches. */
async function applyGeometry(patches) {
  for (const patch of patches) {
    const row = await get("items", patch.id);
    if (!row) continue;
    Object.assign(row, patch);
    await put("items", row);
  }
}

function recordGeometry(before, after, label) {
  if (before.every((b, n) => b.x === after[n].x && b.y === after[n].y &&
                             b.width === after[n].width && b.height === after[n].height)) return;
  record({
    label,
    undo: () => applyGeometry(before),
    redo: () => applyGeometry(after),
  });
}

async function setField(id, field, value) {
  const row = await get("items", id);
  if (!row) return;
  row[field] = value;
  await put("items", row);
}

async function applyPatch(id, patch) {
  const row = await get("items", id);
  if (!row) return;
  Object.assign(row, patch);
  await put("items", row);
}

function recordPatch(id, before, after, label) {
  record({
    label,
    undo: () => applyPatch(id, before),
    redo: () => applyPatch(id, after),
  });
}

function recordField(id, field, before, after, label) {
  if (before === after) return;
  record({
    label,
    undo: () => setField(id, field, before),
    redo: () => setField(id, field, after),
  });
}

/* ---- mutations ---- */

async function saveItem(item) {
  await put("items", item);
  await touchBoard(item.boardId);
  scheduleSync();
}

async function addItem(data) {
  const top = items.reduce((max, i) => Math.max(max, i.z), 0);
  const item = Object.assign({
    id: uid(), boardId, kind: "image", x: 40, y: 40, width: IMAGE_W, height: 200,
    z: top + 1, blobId: "", remoteUrl: "", src: "", sourceUrl: "", sourceLabel: "",
    text: "", color: "yellow", caption: "", captionOn: false,
  }, data);
  items.push(item);
  await saveItem(item);
  $("hint") && $("hint").remove();
  $("surface").appendChild(await makeNode(item));
  setSelection([item.id]);
  return item;
}

async function deleteItems(ids) {
  const rows = ids.map((id) => items.find((i) => i.id === id)).filter(Boolean).map(snapshot);
  if (rows.length === 0) return;
  const owner = boardId;

  items = items.filter((i) => !ids.includes(i.id));
  for (const id of ids) {
    const el = nodes.get(id);
    if (el) el.remove();
    nodes.delete(id);
    selection.delete(id);
  }
  await delRows(ids);
  await touchBoard(owner);
  refreshSelection();
  scheduleSync();

  record({
    label: rows.length > 1 ? rows.length + "개 삭제" : labelFor(rows[0]) + " 삭제",
    undo: async () => { await putRows(rows); await touchBoard(owner); },
    redo: async () => { await delRows(ids); await touchBoard(owner); },
  });
}

const labelFor = (item) =>
  item.kind === "note" ? "메모" : item.kind === "embed" ? "임베드" : "이미지";

const removeItem = (id) => deleteItems([id]);
const removeSelected = () => deleteItems([...selection]);

async function setColor(id, color) {
  const item = items.find((i) => i.id === id);
  if (!item) return;
  const before = item.color;
  item.color = color;
  const note = nodes.get(id).querySelector(".note:not(textarea)");
  if (note) note.className = "note view " + color + (item.text ? "" : " ph");
  await saveItem(item);
  recordField(id, "color", before, color, "메모 색");
}

async function addImported(list, at) {
  const added = [];
  for (const entry of list) {
    const size = entry.kind === "embed"
      ? EMBED
      : { width: IMAGE_W, height: Math.round(IMAGE_W * (entry.ratio || 0.7)) };
    const base = at ? { x: at.x, y: at.y } : dropPoint(size);
    added.push(await addItem({
      kind: entry.kind,
      blobId: entry.blobId || "",
      remoteUrl: entry.remoteUrl || "",
      src: entry.src || "",
      sourceUrl: entry.sourceUrl || "",
      sourceLabel: entry.label || "",
      x: base.x, y: base.y, width: size.width, height: size.height,
    }));
    if (at) { at.x += 28; at.y += 28; }
  }
  if (added.length) {
    recordAdd(added, added.length > 1 ? added.length + "개 추가" : labelFor(added[0]) + " 추가");
  }
}

async function addFiles(files, at) {
  const list = [];
  for (const file of files) {
    if (!file.type.startsWith("image/")) continue;
    const blobId = await saveBlob(file);
    const size = await measure(await blobUrl(blobId));
    list.push({ kind: "image", blobId, label: file.name,
                ratio: size.w > 0 ? size.h / size.w : 0.7 });
  }
  if (list.length) await addImported(list, at);
  return list.length;
}

/* ---- remote images ----
   A link whose host refuses CORS can be displayed but never read, so its bytes
   never reach us and it cannot be drawn into an exported PNG. These give the
   two ways out: try again for the bytes, or put a real file in its place. */

/** Re-renders one item in place after its picture changed. */
async function repaintItem(item) {
  const old = nodes.get(item.id);
  if (!old) return;
  const fresh = await makeNode(item);
  old.replaceWith(fresh);
  refreshSelection();
}

/** Tries once more to take a permanent copy of a remote image's bytes. */
async function rehostRemote(item) {
  if (!item.remoteUrl) return false;
  let blob;
  try {
    const response = await fetch(item.remoteUrl, { mode: "cors" });
    if (!response.ok) return false;
    blob = await response.blob();
  } catch {
    return false;   // the host does not allow reading it from a page
  }
  if (!blob.type.startsWith("image/")) return false;

  const before = { blobId: item.blobId, remoteUrl: item.remoteUrl };
  item.blobId = await saveBlob(blob);
  item.remoteUrl = "";
  await saveItem(item);
  recordPatch(item.id, before, { blobId: item.blobId, remoteUrl: "" }, "이미지 저장");
  return true;
}

async function tryRehost(item) {
  notify("가져오는 중…");
  if (await rehostRemote(item)) {
    await repaintItem(item);
    notify("이미지를 저장했습니다 — 이제 내보내기에도 담깁니다");
  } else {
    notify("이 주소는 페이지에서 읽을 수 없습니다 — '교체'로 파일을 넣어 주세요");
  }
}

/** Swaps an item's picture for a local file, keeping where and how big it is. */
async function replaceImage(item, file) {
  if (!file || !file.type.startsWith("image/")) return;
  const blobId = await saveBlob(file);
  const size = await measure(await blobUrl(blobId));
  const ratio = size.w > 0 ? size.h / size.w : item.height / item.width;

  const before = { blobId: item.blobId, remoteUrl: item.remoteUrl, height: item.height };
  const after = { blobId, remoteUrl: "", height: Math.round(item.width * ratio) };
  Object.assign(item, after);
  await saveItem(item);
  await repaintItem(item);
  recordPatch(item.id, before, after, "이미지 교체");
  notify("이미지를 교체했습니다");
}

function pickReplacement(item) {
  const picker = $("filePicker");
  picker.multiple = false;
  picker.onchange = async () => {
    const file = picker.files[0];
    picker.value = "";
    picker.multiple = true;
    await replaceImage(item, file);
  };
  picker.click();
}

/* ---- pointer interaction ---- */

$("surface").addEventListener("pointerdown", (event) => {
  // Links inside a note (and the embed caption) stay clickable.
  if (event.target.closest("a")) return;
  if (event.target.closest(".remote-tag")) { event.stopPropagation(); openRemoteFixer(); return; }

  const el = event.target.closest(".item");
  if (!el) {
    if (!event.shiftKey) setSelection([]);
    stopEditing();
    // Dragging on empty canvas draws a selection rectangle.
    const start = toBoard(event.clientX, event.clientY);
    marquee = { x: start.x, y: start.y, add: event.shiftKey, base: [...selection], moved: false };
    return;
  }

  const item = items.find((i) => i.id === el.dataset.id);
  if (!item || editingId === item.id) return;

  if (event.shiftKey) {
    toggleSelected(item.id);
    if (!selection.has(item.id)) return;      // shift-clicked out of the group
  } else if (!selection.has(item.id)) {
    // Clicking one of several keeps the group, so it can be dragged as a whole.
    setSelection([item.id]);
  }
  bringToFront(item);

  const resizing = event.target.classList.contains("handle");
  if (resizing) event.stopPropagation();

  // Every selected item moves together, so remember where each started.
  const origins = new Map();
  if (!resizing) {
    for (const id of selection) {
      const other = items.find((i) => i.id === id);
      if (other) origins.set(id, { x: other.x, y: other.y });
    }
  }
  const touched = resizing ? [item.id] : [...origins.keys()];
  drag = {
    mode: resizing ? "resize" : "move",
    id: item.id, px: event.clientX, py: event.clientY,
    origins, w: item.width, h: item.height,
    before: touched.map((id) => geometryOf(items.find((i) => i.id === id))).filter(Boolean),
  };
});

function bringToFront(item) {
  const top = items.reduce((max, i) => Math.max(max, i.z), 0);
  if (item.z === top) return;
  item.z = top + 1;
  nodes.get(item.id).style.zIndex = item.z;
  saveItem(item);
}

// Listening on window keeps a fast drag from slipping off the element.
window.addEventListener("pointermove", (event) => {
  if (marquee) {
    const now = toBoard(event.clientX, event.clientY);
    const box = {
      x: Math.min(marquee.x, now.x), y: Math.min(marquee.y, now.y),
      width: Math.abs(now.x - marquee.x), height: Math.abs(now.y - marquee.y),
    };
    if (!marquee.moved && box.width + box.height < 4) return;   // ignore a plain click
    marquee.moved = true;
    marquee.box = box;
    paintMarquee(box);

    // Anything the rectangle touches counts as selected.
    const hits = items.filter((i) =>
      i.x < box.x + box.width && i.x + i.width > box.x &&
      i.y < box.y + box.height && i.y + i.height > box.y).map((i) => i.id);
    setSelection(marquee.add ? [...new Set([...marquee.base, ...hits])] : hits);
    return;
  }
  if (!drag) return;
  const dx = (event.clientX - drag.px) / zoom;
  const dy = (event.clientY - drag.py) / zoom;

  if (drag.mode === "move") {
    for (const [id, origin] of drag.origins) {
      const item = items.find((i) => i.id === id);
      if (!item) continue;
      item.x = Math.max(0, origin.x + dx);
      item.y = Math.max(0, origin.y + dy);
      place(nodes.get(id), item);
    }
    return;
  }

  const item = items.find((i) => i.id === drag.id);
  if (!item) return;
  item.width = Math.max(MIN, drag.w + dx);
  // Images keep their aspect ratio; notes and embeds resize freely.
  item.height = item.kind === "image" && drag.w > 0
    ? Math.round(item.width * (drag.h / drag.w))
    : Math.max(MIN, drag.h + dy);
  place(nodes.get(item.id), item);
});

window.addEventListener("pointerup", () => {
  if (marquee) {
    const dragged = marquee.moved;
    marquee = null;
    const band = $("marquee");
    if (band) band.remove();
    if (dragged) return;
  }
  if (!drag) return;
  const { before, mode } = drag;
  const ids = mode === "move" ? [...drag.origins.keys()] : [drag.id];
  drag = null;

  const after = [];
  for (const id of ids) {
    const item = items.find((i) => i.id === id);
    if (!item) continue;
    saveItem(item);
    after.push(geometryOf(item));
  }
  if (before.length === after.length) {
    recordGeometry(before, after, mode === "move" ? "이동" : "크기 변경");
  }
});

function paintMarquee(box) {
  let band = $("marquee");
  if (!band) {
    band = document.createElement("div");
    band.id = "marquee";
    $("surface").appendChild(band);
  }
  band.style.left = box.x + "px";
  band.style.top = box.y + "px";
  band.style.width = box.width + "px";
  band.style.height = box.height + "px";
}

const geometryOf = (item) =>
  item ? { id: item.id, x: item.x, y: item.y, width: item.width, height: item.height } : null;

/* ---- note editing ---- */

$("surface").addEventListener("dblclick", (event) => {
  const el = event.target.closest(".item");
  if (!el) return;
  const item = items.find((i) => i.id === el.dataset.id);
  if (!item) return;

  if (event.target.closest(".caption")) { editCaption(item); return; }
  if (item.kind === "note") startEditing(item);
});

function editCaption(item) {
  const el = nodes.get(item.id);
  if (!el) return;
  const view = el && el.querySelector(".caption");
  if (!view || view.tagName === "TEXTAREA") return;

  const before = item.caption || "";
  const editor = document.createElement("textarea");
  editor.className = "caption";
  editor.value = before;
  editor.placeholder = "캡션";
  editor.addEventListener("pointerdown", (e) => e.stopPropagation());
  editor.addEventListener("keydown", (e) => { if (e.key === "Escape") editor.blur(); });
  editor.addEventListener("blur", async () => {
    item.caption = editor.value;
    decorateExtras(el, item);
    refreshSelection();
    await saveItem(item);
    recordField(item.id, "caption", before, item.caption, "캡션");
  });
  view.replaceWith(editor);
  editor.focus();
}

async function toggleCaption(item) {
  const before = !!item.captionOn;
  item.captionOn = !before;
  decorateExtras(nodes.get(item.id), item);
  refreshSelection();
  await saveItem(item);
  recordField(item.id, "captionOn", before, item.captionOn, before ? "캡션 숨김" : "캡션 표시");
  if (item.captionOn) editCaption(item);
}

/** Attaches or edits the link an item points at. */
async function editLink(item) {
  const before = item.sourceUrl || "";
  const entered = prompt("이 항목에 연결할 주소 (비우면 링크 삭제)", before);
  if (entered === null) return;

  const url = entered.trim();
  if (url && !/^https?:\/\//i.test(url)) {
    notify("http:// 또는 https:// 로 시작하는 주소만 넣을 수 있습니다");
    return;
  }
  item.sourceUrl = url;
  if (!url) item.sourceLabel = "";
  else if (!item.sourceLabel) {
    try { item.sourceLabel = new URL(url).hostname.replace(/^www\./, ""); } catch { /* keep empty */ }
  }
  decorateExtras(nodes.get(item.id), item);
  refreshSelection();
  await saveItem(item);
  recordField(item.id, "sourceUrl", before, url, url ? "링크 연결" : "링크 삭제");
}

let noteTimer = null;
let editingBefore = "";

function startEditing(item) {
  stopEditing();
  editingId = item.id;
  editingBefore = item.text || "";
  const el = nodes.get(item.id);
  const view = el.querySelector(".note");
  const editor = document.createElement("textarea");
  editor.className = "note " + (item.color || "yellow");
  editor.value = item.text || "";
  // The value is written into state on every keystroke, so closing the editor
  // can never race the save.
  editor.addEventListener("input", () => {
    item.text = editor.value;
    clearTimeout(noteTimer);
    noteTimer = setTimeout(() => saveItem(item), 500);
  });
  editor.addEventListener("keydown", (e) => { if (e.key === "Escape") stopEditing(); });
  editor.addEventListener("blur", () => stopEditing());
  editor.addEventListener("pointerdown", (e) => e.stopPropagation());
  view.replaceWith(editor);
  editor.focus();
}

function stopEditing() {
  if (!editingId) return;
  const item = items.find((i) => i.id === editingId);
  const el = nodes.get(editingId);
  editingId = null;
  if (!item || !el) return;

  const editor = el.querySelector("textarea.note");
  if (!editor) return;
  item.text = editor.value;
  editor.replaceWith(noteView(item));
  clearTimeout(noteTimer);
  saveItem(item);
  // One entry per editing session rather than per keystroke.
  recordField(item.id, "text", editingBefore, item.text, "메모 편집");
}

/* ---- keyboard, paste, drop ---- */

window.addEventListener("keydown", (event) => {
  const tag = event.target.tagName;
  if (tag === "TEXTAREA" || tag === "INPUT") return;
  if ((event.key === "Delete" || event.key === "Backspace") && selection.size) {
    event.preventDefault();
    removeSelected();
  }
  if (event.key === "Escape") { setSelection([]); stopEditing(); }
  if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "s") {
    event.preventDefault();
    saveNow();
  }
  if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "z") {
    event.preventDefault();
    if (event.shiftKey) redo(); else undo();
  }
  if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "y") {
    event.preventDefault();
    redo();
  }
  if ((event.metaKey || event.ctrlKey) && (event.key === "=" || event.key === "+")) {
    event.preventDefault();
    stepZoom(1);
  }
  if ((event.metaKey || event.ctrlKey) && event.key === "-") {
    event.preventDefault();
    stepZoom(-1);
  }
  if ((event.metaKey || event.ctrlKey) && event.key === "0") {
    event.preventDefault();
    setZoom(1);
  }
  // Ctrl/⌘+A selects everything on the board, to move it all at once.
  if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "a" && boardId) {
    event.preventDefault();
    setSelection(items.map((i) => i.id));
  }
});

window.addEventListener("paste", async (event) => {
  if (!boardId) return;
  const tag = event.target.tagName;
  if (tag === "TEXTAREA" || tag === "INPUT") return;

  const files = Array.from(event.clipboardData ? event.clipboardData.items : [])
    .filter((entry) => entry.kind === "file" && entry.type.startsWith("image/"))
    .map((entry) => entry.getAsFile())
    .filter(Boolean);
  if (files.length === 0) return;

  event.preventDefault();
  setStatus("붙여넣는 중…");
  await addFiles(files);
  setStatus("추가됨");
});

$("surface").addEventListener("dragover", (event) => {
  event.preventDefault();
  $("surface").classList.add("drop");
});
$("surface").addEventListener("dragleave", () => $("surface").classList.remove("drop"));
$("surface").addEventListener("drop", async (event) => {
  event.preventDefault();
  $("surface").classList.remove("drop");
  await addFiles(Array.from(event.dataTransfer.files), toBoard(event.clientX, event.clientY));
});

/* ==========================================================================
   Export the board as a PNG. Everything is redrawn on a canvas rather than
   screenshotted, so the result is independent of zoom and scroll position.
   Embeds can't be reached (cross-origin iframe), so they are drawn as the card
   they stand for, with their source name.
   ========================================================================== */

const EXPORT_SCALE = 2;
const EXPORT_PAD = 48;

/**
 * Chromium discards a download filename that isn't ASCII — a Korean board name
 * lands as "download" — so the title is reduced to what survives, and the date
 * carries the rest of the identity.
 */
function safeFileName(title, ext) {
  const stem = String(title || "")
    .replace(/[^\x20-\x7E]/g, "")
    .replace(/[\\/:*?"<>|]/g, "")
    .trim()
    .replace(/\s+/g, " ")
    .slice(0, 40);
  const date = new Date().toISOString().slice(0, 10);
  return (stem ? stem + "-" : "moodboard-") + date + "." + ext;
}

function roundRect(ctx, x, y, w, h, r) {
  const radius = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + radius, y);
  ctx.arcTo(x + w, y, x + w, y + h, radius);
  ctx.arcTo(x + w, y + h, x, y + h, radius);
  ctx.arcTo(x, y + h, x, y, radius);
  ctx.arcTo(x, y, x + w, y, radius);
  ctx.closePath();
}

/** Wraps on spaces where there are any and on characters otherwise, which is
    what Korean text needs. */
function wrapText(ctx, text, maxWidth) {
  const lines = [];
  for (const paragraph of String(text).split("\n")) {
    let line = "";
    for (const token of paragraph.split(/(\s+)/)) {
      if (token === "") continue;
      if (ctx.measureText(line + token).width <= maxWidth) { line += token; continue; }
      if (line) { lines.push(line); line = ""; }
      if (ctx.measureText(token).width <= maxWidth) { line = token; continue; }
      for (const ch of token) {
        if (ctx.measureText(line + ch).width > maxWidth) { lines.push(line); line = ""; }
        line += ch;
      }
    }
    lines.push(line);
  }
  return lines;
}

function drawLines(ctx, lines, x, y, lineHeight, maxHeight) {
  let offset = 0;
  for (const line of lines) {
    if (maxHeight !== undefined && offset + lineHeight > maxHeight) break;
    ctx.fillText(line, x, y + offset);
    offset += lineHeight;
  }
  return offset;
}

const loadImage = (src) => new Promise((resolve) => {
  const img = new Image();
  img.onload = () => resolve(img);
  img.onerror = () => resolve(null);
  // Remote images taint the canvas unless the host allows it; asking for CORS
  // here means a permissive host still exports, and a strict one just fails to
  // load and falls back to a placeholder.
  if (!src.startsWith("blob:")) img.crossOrigin = "anonymous";
  img.src = src;
});

async function exportBoardImage() {
  if (items.length === 0) { notify("보드가 비어 있습니다"); return; }

  // Remote images hold only an address. Try once more for their bytes, then say
  // plainly which ones still can't be drawn before producing a lossy file.
  const remote = items.filter((i) => i.kind === "image" && i.remoteUrl);
  if (remote.length) {
    notify("원격 이미지 가져오는 중…");
    for (const item of remote) {
      if (await rehostRemote(item)) await repaintItem(item);
    }
  }
  const stillRemote = items.filter((i) => i.kind === "image" && i.remoteUrl);
  if (stillRemote.length) {
    const names = stillRemote.map((i) => "· " + (i.sourceLabel || i.remoteUrl)).join("\n");
    const ok = confirm(
      "이미지 " + stillRemote.length + "개는 주소만 저장돼 있어 그림 대신 자리표시로 들어갑니다.\n\n" +
      names + "\n\n" +
      "확인 = 자리표시를 넣고 계속\n" +
      "취소 = 일괄 교체 창 열기\n\n" +
      "화면에 보이는 그대로 담고 싶다면 '캡처' 버튼을 쓰세요 — 원격 이미지와 임베드까지 들어갑니다.");
    if (!ok) { openRemoteFixer(); return; }
  }

  notify("이미지 만드는 중…");

  const box = contentBounds(EXPORT_PAD);
  const canvas = document.createElement("canvas");
  canvas.width = Math.round(box.width * EXPORT_SCALE);
  canvas.height = Math.round(box.height * EXPORT_SCALE);
  const ctx = canvas.getContext("2d");
  ctx.scale(EXPORT_SCALE, EXPORT_SCALE);
  ctx.translate(-box.x, -box.y);

  ctx.fillStyle = "#f4f2ee";
  ctx.fillRect(box.x, box.y, box.width, box.height);
  ctx.fillStyle = "#d8d3ca";
  for (let x = Math.ceil(box.x / 24) * 24; x < box.x + box.width; x += 24) {
    for (let y = Math.ceil(box.y / 24) * 24; y < box.y + box.height; y += 24) {
      ctx.fillRect(x, y, 1, 1);
    }
  }

  const font = getComputedStyle(document.body).fontFamily;
  let skipped = 0;

  for (const item of [...items].sort((a, b) => a.z - b.z)) {
    ctx.save();
    if (item.kind === "image") {
      const src = item.blobId ? await blobUrl(item.blobId) : item.remoteUrl;
      const img = src ? await loadImage(src) : null;
      if (img) {
        ctx.save();
        roundRect(ctx, item.x, item.y, item.width, item.height, 6);
        ctx.clip();
        ctx.drawImage(img, item.x, item.y, item.width, item.height);
        ctx.restore();
      } else {
        skipped++;
        ctx.fillStyle = "#ece8e1";
        roundRect(ctx, item.x, item.y, item.width, item.height, 6);
        ctx.fill();
        ctx.save();
        ctx.strokeStyle = "#c9c2b5";
        ctx.setLineDash([5, 4]);
        roundRect(ctx, item.x + 0.5, item.y + 0.5, item.width - 1, item.height - 1, 6);
        ctx.stroke();
        ctx.restore();
        ctx.fillStyle = "#8b8579";
        ctx.font = "12px " + font;
        ctx.textBaseline = "top";
        ctx.save();
        roundRect(ctx, item.x, item.y, item.width, item.height, 6);
        ctx.clip();
        const lines = ["원격 링크 — 이미지를 담을 수 없음"]
          .concat(wrapText(ctx, item.sourceLabel || item.remoteUrl || "", item.width - 24));
        drawLines(ctx, lines, item.x + 12, item.y + 12, 17, item.height - 20);
        ctx.restore();
      }
    } else if (item.kind === "note") {
      const colour = COLOR_MAP.get(item.color) || COLOR_MAP.get("yellow");
      ctx.fillStyle = colour.bg;
      ctx.strokeStyle = colour.line;
      ctx.lineWidth = 1;
      roundRect(ctx, item.x, item.y, item.width, item.height, 6);
      ctx.fill();
      ctx.stroke();
      if (item.text) {
        ctx.save();
        roundRect(ctx, item.x, item.y, item.width, item.height, 6);
        ctx.clip();
        ctx.fillStyle = "#1c1a17";
        ctx.font = "13px " + font;
        ctx.textBaseline = "top";
        drawLines(ctx, wrapText(ctx, item.text, item.width - 24),
                  item.x + 12, item.y + 12, 20.8, item.height - 20);
        ctx.restore();
      }
    } else {
      ctx.fillStyle = "#ffffff";
      ctx.strokeStyle = "#e3ddd3";
      ctx.lineWidth = 1;
      roundRect(ctx, item.x, item.y, item.width, item.height, 6);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "#8b8579";
      ctx.font = "12px " + font;
      ctx.textBaseline = "top";
      ctx.fillText(item.sourceLabel || "임베드", item.x + 12, item.y + 12);
      ctx.fillText("(임베드는 이미지로 담을 수 없습니다)", item.x + 12, item.y + 32);
    }

    if (item.captionOn && item.caption) {
      ctx.font = "12px " + font;
      ctx.textBaseline = "top";
      const lines = wrapText(ctx, item.caption, item.width - 10);
      const widest = Math.max(...lines.map((line) => ctx.measureText(line).width));
      ctx.fillStyle = "rgba(244,242,238,.92)";
      roundRect(ctx, item.x, item.y + item.height + 6, widest + 10, lines.length * 18 + 4, 4);
      ctx.fill();
      ctx.fillStyle = "#6f6a5f";
      drawLines(ctx, lines, item.x + 5, item.y + item.height + 8, 18);
    }
    ctx.restore();
  }

  let blob;
  try {
    blob = await new Promise((resolve, reject) =>
      canvas.toBlob((b) => (b ? resolve(b) : reject(new Error("toBlob failed"))), "image/png"));
  } catch {
    notify("원격 링크 이미지 때문에 내보낼 수 없습니다 — 해당 이미지를 복사해 붙여넣어 주세요");
    return;
  }

  const board = await get("boards", boardId);
  await saveFile(safeFileName(board && board.title, "png"), blob);
  if (skipped) notify("이미지 " + skipped + "개는 자리표시로 들어갔습니다");
}

/* ==========================================================================
   Fixing remote links in bulk. The pictures render (the browser will show them)
   but can't be read, so the list shows each one and lets a real file take its
   place — matching by eye rather than by guessing an order.
   ========================================================================== */

function openRemoteFixer() {
  const remotes = items.filter((i) => i.kind === "image" && i.remoteUrl);
  if (remotes.length === 0) { notify("원격 링크 이미지가 없습니다"); return; }

  const root = $("dialogRoot");
  const close = () => root.replaceChildren();
  const filled = new Set();

  const veil = document.createElement("div");
  veil.className = "veil-full";
  const modal = document.createElement("div");
  modal.className = "modal";
  veil.appendChild(modal);

  const head = document.createElement("div");
  head.className = "modal-head";
  head.innerHTML = "<h3>원격 링크 이미지 " + remotes.length + "개</h3>";
  const x = document.createElement("button");
  x.className = "x";
  x.setAttribute("aria-label", "닫기");
  x.textContent = "✕";
  x.addEventListener("click", close);
  head.appendChild(x);
  modal.appendChild(head);

  const note = document.createElement("p");
  note.className = "fine";
  note.style.margin = "0 0 14px";
  note.innerHTML = "이 이미지들은 <b>주소만</b> 저장돼 있어 보드를 이미지로 내보낼 때 담기지 않습니다. " +
                   "파일을 넣으면 자리와 크기, 캡션은 그대로 두고 그림만 바뀝니다.";
  modal.appendChild(note);

  const actions = document.createElement("div");
  actions.style.cssText = "display:flex;gap:8px;margin-bottom:14px";
  const retryAll = document.createElement("button");
  retryAll.className = "btn btn-sm";
  retryAll.textContent = "다시 받아 보기";
  const pickAll = document.createElement("button");
  pickAll.className = "btn btn-primary btn-sm";
  pickAll.textContent = "파일 여러 장 한 번에 선택";
  actions.append(retryAll, pickAll);
  modal.appendChild(actions);

  const list = document.createElement("div");
  list.className = "fixlist";
  modal.appendChild(list);

  const rows = remotes.map((item) => {
    const row = document.createElement("div");
    row.className = "fixrow";
    row.innerHTML = '<img src="' + esc(item.remoteUrl) + '" alt="">' +
      '<div class="meta"><b>' + esc(item.sourceLabel || item.remoteUrl) + "</b>" +
      "<span>주소만 저장됨</span></div>";
    const pick = document.createElement("button");
    pick.className = "btn btn-sm";
    pick.textContent = "파일 선택";
    pick.addEventListener("click", () => {
      const picker = $("filePicker");
      picker.multiple = false;
      picker.onchange = async () => {
        const file = picker.files[0];
        picker.value = "";
        picker.multiple = true;
        if (file) { await replaceImage(item, file); markDone(item, row); }
      };
      picker.click();
    });
    row.appendChild(pick);
    list.appendChild(row);
    return { item, row };
  });

  function markDone(item, row) {
    filled.add(item.id);
    row.classList.add("done");
    row.querySelector(".meta span").textContent = "교체됨";
    const button = row.querySelector("button");
    if (button) button.disabled = true;
    if (filled.size === rows.length) {
      notify("원격 링크를 모두 교체했습니다");
      close();
    }
  }

  retryAll.addEventListener("click", async () => {
    retryAll.disabled = true;
    retryAll.textContent = "받는 중…";
    let saved = 0;
    for (const { item, row } of rows) {
      if (filled.has(item.id)) continue;
      if (await rehostRemote(item)) { await repaintItem(item); markDone(item, row); saved++; }
    }
    retryAll.disabled = false;
    retryAll.textContent = "다시 받아 보기";
    notify(saved ? saved + "개를 저장했습니다" : "다시 받아도 읽을 수 없는 주소입니다");
  });

  // Files fill the remaining rows top to bottom, in the order they were chosen.
  pickAll.addEventListener("click", () => {
    const picker = $("filePicker");
    picker.multiple = true;
    picker.onchange = async () => {
      const files = Array.from(picker.files);
      picker.value = "";
      const open = rows.filter(({ item }) => !filled.has(item.id));
      for (let n = 0; n < Math.min(files.length, open.length); n++) {
        await replaceImage(open[n].item, files[n]);
        markDone(open[n].item, open[n].row);
      }
      if (files.length > open.length) notify("파일이 남았습니다 — 자리보다 " + (files.length - open.length) + "장 많습니다");
    };
    picker.click();
  });

  veil.addEventListener("click", (event) => { if (event.target === veil) close(); });
  root.replaceChildren(veil);
}

/* ==========================================================================
   Capture. Redrawing can't include what the page may not read — remote images,
   and embeds most of all. A screen capture can: the viewer grants it, so the
   pixels come from the compositor rather than from the page. The trade is that
